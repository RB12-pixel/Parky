<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impostazioni - PARKY</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<style>
  :root{
    --bg:#0a0f0a; --card:#0f1410; --border:#1f3321; --text:#e8f5e9; 
    --muted:#a7c4a9; --accent:#16a34a; --accent2:#22c55e;
  }
  body.light{
    --bg:#f5f5f5; --card:#ffffff; --border:#d1d5db; --text:#1f2937; 
    --muted:#6b7280; --accent:#16a34a; --accent2:#22c55e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:system-ui;padding-top:60px;transition:0.3s}
  .header{position:fixed;top:0;left:0;width:100%;height:60px;background:var(--card);border-bottom:2px solid var(--accent);z-index:998;display:flex;align-items:center;padding:0 15px}
  .header h2{color:var(--accent);margin:0 auto;font-weight:800;font-size:22px}
  .openbtn{font-size:26px;cursor:pointer;background:var(--accent);color:#000;padding:6px 12px;border:none;border-radius:10px;font-weight:900}
  .sidebar{height:100%;width:0;position:fixed;z-index:1000;top:0;left:0;background:var(--card);overflow-x:hidden;transition:0.3s;padding-top:60px;border-right:2px solid var(--accent)}
  .sidebar a{padding:16px 24px;text-decoration:none;font-size:18px;color:var(--muted);display:block}
  .sidebar a:hover{color:var(--accent);background:var(--border)}
  .sidebar .closebtn{position:absolute;top:10px;right:20px;font-size:32px;color:var(--muted)}
  .main{padding:20px;max-width:500px;margin:0 auto}
  .card{background:var(--card);border:2px solid var(--border);padding:20px;border-radius:16px;margin:20px 0}
  h3{color:var(--accent);margin-bottom:15px;font-size:20px;text-align:center}
  .toggle{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--border)}
  .toggle:last-child{border:0}
  .switch{position:relative;display:inline-block;width:60px;height:34px}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border);transition:.4s;border-radius:34px}
  .slider:before{position:absolute;content:"";height:26px;width:26px;left:4px;bottom:4px;background:white;transition:.4s;border-radius:50%}
  input:checked + .slider{background:var(--accent)}
  input:checked + .slider:before{transform:translateX(26px)}
</style>
</head>
<body>

<div class="header">
  <button class="openbtn" onclick="openNav()">☰</button>
  <h2>⚙️ IMPOSTAZIONI</h2>
</div>

<div id="mySidebar" class="sidebar">
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">×</a>
  <a href="index.html">🏠 Home</a>
  <a href="salva.html">📍 Salvataggi</a>
  <a href="impostazioni.html">⚙️ Impostazioni</a>
</div>

<div class="main">
  <div class="card">
    <h3>Aspetto</h3>
    <div class="toggle">
      <span>🌙 Tema Scuro</span>
      <label class="switch">
        <input type="checkbox" id="temaToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <h3>Info</h3>
    <p style="color:var(--muted);text-align:center">PARKY v1.2</p>
    <p style="color:var(--muted);text-align:center;font-size:14px">Fatto con ☕ e codice</p>
  </div>
</div>

<script>
function openNav(){document.getElementById("mySidebar").style.width = "260px";}
function closeNav(){document.getElementById("mySidebar").style.width = "0";}

// TEMA
function applicaTema(){
  let tema = localStorage.getItem('parky_tema') || 'dark';
  if(tema === 'light') {
    document.body.classList.add('light');
    document.getElementById('temaToggle').checked = false;
  } else {
    document.body.classList.remove('light');
    document.getElementById('temaToggle').checked = true;
  }
}
applicaTema();

document.getElementById('temaToggle').onchange = function(){
  if(this.checked){
    localStorage.setItem('parky_tema', 'dark');
    document.body.classList.remove('light');
  } else {
    localStorage.setItem('parky_tema', 'light');
    document.body.classList.add('light');
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PARKY</title>
<style>
body{background:#111;color:white;font-family:sans-serif;text-align:center;padding:20px;margin:0;touch-action:none}
.header{display:flex;justify-content:space-between;max-width:600px;margin:0 auto}
.header-title{color:#00ff88;font-size:32px;font-weight:800}
.menu-btn{font-size:32px;background:none;border:none;color:white;cursor:pointer}
.sidebar{position:fixed;top:0;right:-300px;width:280px;height:100%;background:#1a1a1a;z-index:1000;transition:0.3s;padding:20px;text-align:left}
.sidebar.aperta{right:0}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:999;display:none}
.overlay.mostra{display:block}
.chips-container{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:15px auto}
.chip{background:#00FF88;color:#111;padding:12px 15px;border-radius:12px;font-weight:900;cursor:pointer;min-width:100px}
.chip.attiva{background:#00FFAA;box-shadow:0 0 15px #00FF88}
.select-container{display:flex;justify-content:center;gap:10px;margin:15px auto;max-width:500px}
#selettoreMacchine{flex:1;padding:14px;background:#1e1e1e;color:white;border:none;border-radius:10px}
.btn-quadrato{padding:14px;background:#2a2a2a;color:white;border:none;border-radius:10px;font-size:20px}
.container-bottoni{display:flex;flex-direction:column;gap:12px;max-width:500px;margin:20px auto}
button{width:100%;padding:18px;border-radius:15px;border:none;font-weight:bold;cursor:pointer;font-size:16px}
#salvaBtn{background:#00FF88;color:#111}
#fotoBtn{background:#FF9500;color:white}
#navigaBtn{background:#007AFF;color:white;display:none}
#nuovaBtn{background:#555;color:white}
#cancellaSalvataggioBtn{background:#FF3B30;color:white;display:none}
#fotoPreview{width:100%;max-width:500px;margin:10px auto;border-radius:15px;display:none}
.nota-container{background:#222;padding:10px;border-radius:10px;margin:10px auto;max-width:500px;color:#00FF88;display:none;gap:6px;justify-content:center}
.tachi-container{background:#222;padding:15px;border-radius:10px;margin:10px auto;max-width:500px;display:none}
.tachi-timer{font-size:36px;font-weight:900;color:#00FF88}
.tachi-timer.scaduto{color:#FF3B30;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.5}}
#status{color:#aaa;margin-top:15px}
.popup-tachi{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:2000;display:none;justify-content:center;align-items:center}
.popup-box{display:flex;flex-direction:column;align-items:center;background:#1a1a1a;padding:20px;border-radius:20px}
.orologio{width:300px;height:300px;background:#222;border-radius:50%;touch-action:none}
.ora-display{font-size:42px;font-weight:900;color:#00FF88;margin:15px 0}
.input-ora{padding:12px;font-size:22px;text-align:center;width:120px;border-radius:10px;border:2px solid #00FF88;background:#111;color:#00FF88;font-weight:900;margin-bottom:15px}
</style>
</head>
<body onload="aggiornaUI()">
<div class="overlay" id="overlay" onclick="chiudiMenu()"></div>
<div class="sidebar" id="sidebar"><h3 style="color:#00FF88">MENU PARKY</h3><div onclick="chiudiMenu()">🏠 Menu Principale</div><div onclick="apriPopupTachi()">⏰ Disco Orario</div></div>
<div class="header"><div class="header-title">PARKY</div><button class="menu-btn" onclick="apriMenu()">☰</button></div>
<div class="chips-container" id="chipsContainer"></div>
<div class="select-container"><select id="selettoreMacchine" onchange="cambiaMacchina()"></select><button class="btn-quadrato" onclick="modificaNome()">✏️</button><button class="btn-quadrato" onclick="eliminaMacchina()">🗑️</button></div>
<div id="status">Caricamento...</div>
<div class="tachi-container" id="tachiBox"><div>Scade alle: <span id="oraTachiDisplay">--:--</span></div><div class="tachi-timer" id="tachiTimer">--:--</div><button style="background:#FF3B30;color:white;padding:10px;margin-top:10px" onclick="fermaTachi()">🛑 FERMA TACHI</button></div>
<div class="nota-container" id="notaBox"><span id="notaText"></span><button onclick="modificaNota()">✏️</button><button onclick="eliminaNota()">🗑️</button></div>
<div class="container-bottoni"><button id="salvaBtn" onclick="salvaPosizione()">1. SALVA POSIZIONE</button><button id="fotoBtn" onclick="scattaFoto()">2. CARICA FOTO</button><button id="navigaBtn" onclick="naviga()">3. APRI SU GOOGLE MAPS</button><button id="nuovaBtn" onclick="nuovaMacchina()">+ AGGIUNGI MACCHINA</button><button id="cancellaSalvataggioBtn" onclick="cancellaSalvataggio()">🗑️ CANCELLA SALVATAGGIO</button></div>
<img id="fotoPreview">

<!-- POPUP NUOVO SENZA MINUTI -->
<div class="popup-tachi" id="popupTachi" onclick="chiudiPopupTachi()">
  <div class="popup-box" onclick="event.stopPropagation()">
    <h2 style="color:#00FF88">IMPOSTA ORA SCADENZA</h2>
    <svg class="orologio" id="orologio" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="95" fill="#111" stroke="#00FF88" stroke-width="3"/>
      <g id="ore"></g>
      <line id="lancettaOre" x1="100" y1="100" x2="100" y2="50" stroke="#00FF88" stroke-width="6"/>
      <line id="lancettaMin" x1="100" y1="100" x2="100" y2="30" stroke="white" stroke-width="4"/>
    </svg>
    <input type="time" id="inputOra" class="input-ora" onclick="event.stopPropagation()" onchange="settaOraDaInput()">
    <div class="ora-display" id="oraDisplay">08:00</div>
    <button style="background:#00FF88;color:#111;width:280px" onclick="event.stopPropagation();confermaTachi()">AVVIA TACHI</button>
    <button style="background:#333;color:white;width:280px" onclick="event.stopPropagation();chiudiPopupTachi()">ANNULLA</button>
  </div>
</div>

<script>
let macchinaAttiva="Auto";let tachiInterval=null;let oraSelezionata={h:8,m:0};let dragging=false;
function apriMenu(){document.getElementById('sidebar').classList.add('aperta');document.getElementById('overlay').classList.add('mostra')}
function chiudiMenu(){document.getElementById('sidebar').classList.remove('aperta');document.getElementById('overlay').classList.remove('mostra')}
function S(k,v){localStorage.setItem(k,JSON.stringify(v))}
function G(k,d){let x=localStorage.getItem(k);return x?JSON.parse(x):d}
function aggiornaUI(){document.getElementById('status').innerText='Pronto';let lista=G('lista',['Auto']);let htmlChips='';lista.forEach(m=>{htmlChips+=`<span class="chip ${m==macchinaAttiva?'attiva':''}" onclick="macchinaAttiva='${m}';aggiornaUI()">${m}</span>`});document.getElementById('chipsContainer').innerHTML=htmlChips;let htmlSel='';lista.forEach(m=>{htmlSel+=`<option ${m==macchinaAttiva?'selected':''}>${m}</option>`});document.getElementById('selettoreMacchine').innerHTML=htmlSel;aggiornaSchermata()}
function cambiaMacchina(){macchinaAttiva=document.getElementById('selettoreMacchine').value;aggiornaUI()}
function nuovaMacchina(){let n=prompt('Nome?');if(!n)return;let l=G('lista',['Auto']);if(l.includes(n))return alert('Già esiste');l.push(n);S('lista',l);macchinaAttiva=n;aggiornaUI()}
function modificaNome(){let v=macchinaAttiva;let n=prompt('Nuovo nome:',v);if(!n||n==v)return;let l=G('lista',['Auto']);if(l.includes(n))return alert('Già usato');let d=G('parky_'+v,{});S('parky_'+n,d);localStorage.removeItem('parky_'+v);l[l.indexOf(v)]=n;S('lista',l);macchinaAttiva=n;aggiornaUI()}
function eliminaMacchina(){let l=G('lista',['Auto']);if(l.length<=1)return alert('Ultima');if(!confirm('Elimino?'))return;localStorage.removeItem('parky_'+macchinaAttiva);l=l.filter(x=>x!=macchinaAttiva);S('lista',l);macchinaAttiva=l[0];aggiornaUI()}
function cancellaSalvataggio(){if(!confirm('Elimino?'))return;localStorage.removeItem('parky_'+macchinaAttiva);aggiornaUI()}
function modificaNota(){let d=G('parky_'+macchinaAttiva,{});let nota=prompt('Nota:',d.nota||'');if(nota===null)return;d.nota=nota;S('parky_'+macchinaAttiva,d);aggiornaSchermata()}
function eliminaNota(){let d=G('parky_'+macchinaAttiva,{});d.nota='';S('parky_'+macchinaAttiva,d);aggiornaSchermata()}
function salvaPosizione(){navigator.geolocation.getCurrentPosition(p=>{let nota=prompt('Nota?','');S('parky_'+macchinaAttiva,{lat:p.coords.latitude,lon:p.coords.longitude,data:new Date().toLocaleString(),nota:nota||''});aggiornaSchermata();alert('Salvata!')},e=>alert('Attiva GPS'))}
function scattaFoto(){let i=document.createElement('input');i.type='file';i.accept='image/*';i.capture='environment';i.onchange=e=>{let r=new FileReader();r.onload=()=>{let d=G('parky_'+macchinaAttiva,{});d.foto=r.result;S('parky_'+macchinaAttiva,d);aggiornaSchermata()};r.readAsDataURL(e.target.files[0])};i.click()}
function naviga(){let d=G('parky_'+macchinaAttiva,{});if(!d.lat)return alert('Salva prima');window.open('https://maps.google.com/?daddr='+d.lat+','+d.lon)}
function fermaTachi(){let d=G('parky_'+macchinaAttiva,{});d.tachi=null;d.oraTachi=null;S('parky_'+macchinaAttiva,d);aggiornaSchermata()}

function apriPopupTachi(){
  chiudiMenu();
  document.getElementById('popupTachi').style.display='flex';
  let now=new Date();
  oraSelezionata.h=now.getHours();
  oraSelezionata.m=Math.round(now.getMinutes()/5)*5;
  document.getElementById('inputOra').value=`${String(oraSelezionata.h).padStart(2,'0')}:${String(oraSelezionata.m).padStart(2,'0')}`;
  setTimeout(initOrologio,100)
}
function chiudiPopupTachi(){document.getElementById('popupTachi').style.display='none'}
function settaOraDaInput(){let val=document.getElementById('inputOra').value;if(!val)return;let parti=val.split(':');oraSelezionata.h=parseInt(parti[0]);oraSelezionata.m=parseInt(parti[1]);aggiornaLancette();}

function initOrologio(){
  const svg=document.getElementById('orologio');const oreG=document.getElementById('ore');oreG.innerHTML='';
  for(let i=1;i<=12;i++){let a=(i*30-90)*Math.PI/180;let x=100+80*Math.cos(a);let y=100+80*Math.sin(a);oreG.innerHTML+=`<text x="${x}" y="${y}" text-anchor="middle" fill="white" font-size="14">${i}</text>`}
  aggiornaLancette();
  const start = (e) => {e.preventDefault(); dragging=true; move(e)};
  const moveF = (e) => {if(dragging) move(e)};
  const end = () => {dragging=false};
  svg.addEventListener('mousedown', start);
  svg.addEventListener('mousemove', moveF);
  svg.addEventListener('mouseup', end);
  svg.addEventListener('touchstart', start, {passive:false});
  svg.addEventListener('touchmove', moveF, {passive:false});
  svg.addEventListener('touchend', end);
}

function move(e){
  e.preventDefault();
  const svg=document.getElementById('orologio');
  const rect=svg.getBoundingClientRect();
  const clientX = e.touches? e.touches[0].clientX : e.clientX;
  const clientY = e.touches? e.touches[0].clientY : e.clientY;
  const x=clientX-rect.left-rect.width/2;
  const y=clientY-rect.top-rect.height/2;
  let a=Math.atan2(y,x)*180/Math.PI+90;if(a<0)a+=360;
  oraSelezionata.m=Math.round(Math.round(a/6)/5)*5;oraSelezionata.h=Math.floor(a/30);if(oraSelezionata.h==12)oraSelezionata.h=0;
  aggiornaLancette();
  document.getElementById('inputOra').value=`${String(oraSelezionata.h).padStart(2,'0')}:${String(oraSelezionata.m).padStart(2,'0')}`;
}
function aggiornaLancette(){document.getElementById('lancettaMin').setAttribute('transform',`rotate(${oraSelezionata.m*6} 100 100)`);document.getElementById('lancettaOre').setAttribute('transform',`rotate(${oraSelezionata.h*30+oraSelezionata.m*0.5} 100 100)`);document.getElementById('oraDisplay').innerText=`${String(oraSelezionata.h).padStart(2,'0')}:${String(oraSelezionata.m).padStart(2,'0')}`}

// NUOVA LOGICA: CALCOLA SCADENZA IN BASE ALL'ORA
function confermaTachi(){
  let now = new Date();
  let scadenza = new Date();
  scadenza.setHours(oraSelezionata.h, oraSelezionata.m, 0, 0);

  // Se l'ora è già passata oggi, metti scadenza a domani
  if(scadenza.getTime() <= now.getTime()){
    scadenza.setDate(scadenza.getDate() + 1);
  }

  let os=`${String(oraSelezionata.h).padStart(2,'0')}:${String(oraSelezionata.m).padStart(2,'0')}`;
  let d=G('parky_'+macchinaAttiva,{});
  d.tachi=scadenza.getTime(); // salva timestamp di scadenza
  d.oraTachi=os;
  S('parky_'+macchinaAttiva,d);
  chiudiPopupTachi();
  aggiornaSchermata();
  alert("Tachi avviato. Scade alle "+os)
}

function aggiornaTachi(ts,ot){
  clearInterval(tachiInterval);
  let box=document.getElementById('tachiBox');
  let timer=document.getElementById('tachiTimer');
  if(!ts){box.style.display='none';return}
  box.style.display='block';
  document.getElementById('oraTachiDisplay').innerText=ot;
  tachiInterval=setInterval(()=>{
    let diff=ts-Date.now();
    if(diff<=0){timer.innerText="SCADUTO!";timer.classList.add('scaduto');clearInterval(tachiInterval);return}
    let h=Math.floor(diff/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);
    timer.innerText=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if(diff<600000)timer.classList.add('scaduto')
  },1000)
}

function aggiornaSchermata(){
  let d=G('parky_'+macchinaAttiva,{});
  if(d.lat){
    document.getElementById('status').innerText='Salvato: '+d.data;
    document.getElementById('navigaBtn').style.display='block';
    document.getElementById('cancellaSalvataggioBtn').style.display='block';
    if(d.nota){document.getElementById('notaText').innerText='📝 '+d.nota;document.getElementById('notaBox').style.display='flex'}else{document.getElementById('notaBox').style.display='none'}
    if(d.foto){document.getElementById('fotoPreview').src=d.foto;document.getElementById('fotoPreview').style.display='block'}else{document.getElementById('fotoPreview').style.display='none'}
    aggiornaTachi(d.tachi,d.oraTachi)
  }else{
    document.getElementById('status').innerText='Pronto';
    document.getElementById('navigaBtn').style.display='none';
    document.getElementById('cancellaSalvataggioBtn').style.display='none';
    document.getElementById('notaBox').style.display='none';
    document.getElementById('fotoPreview').style.display='none';
    document.getElementById('tachiBox').style.display='none';
    clearInterval(tachiInterval)
  }
}
</script>
</body>
</html>
